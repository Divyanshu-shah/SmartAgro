services:
  - type: web
    name: smartagro
    runtime: php
    plan: free
    buildCommand: |
      composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader --no-dev
      npm install
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      php artisan migrate --force
      php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://your-render-app.onrender.com
      - key: DB_CONNECTION
        value: mongodb
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: VITE_APP_NAME
        value: SmartAgro
    autoDeploy: true
